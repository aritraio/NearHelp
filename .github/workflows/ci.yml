name: NearHelp AI — CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ----------------------------------------------------------------------------
  # 1. Frontend & Showcase Verification
  # ----------------------------------------------------------------------------
  frontend-test:
    name: Frontend Test & Build (Admin Dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin_dashboard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./admin_dashboard/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Comprehensive Test Suite (192 Assertions)
        run: npm test

      - name: Verify Production TypeScript Build
        run: npm run build

  # ----------------------------------------------------------------------------
  # 2. Backend Service Verification
  # ----------------------------------------------------------------------------
  backend-lint-and-test:
    name: Backend Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Ruff)
        run: ruff check .

  # ----------------------------------------------------------------------------
  # 3. AI Microservice Verification
  # ----------------------------------------------------------------------------
  ai-service-lint-and-test:
    name: AI Service Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai_service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Ruff)
        run: ruff check .

  # ----------------------------------------------------------------------------
  # 4. Docker Compose Config Validation
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Env Template
        run: cp .env.example .env

      - name: Validate Docker Compose Configuration
        run: docker compose config
