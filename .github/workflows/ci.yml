name: NearHelp AI — CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ----------------------------------------------------------------------------
  # 1. Backend Service Verification
  # ----------------------------------------------------------------------------
  backend-lint-and-test:
    name: Backend Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Ruff)
        run: ruff check .

  # ----------------------------------------------------------------------------
  # 2. AI Microservice Verification
  # ----------------------------------------------------------------------------
  ai-service-lint-and-test:
    name: AI Service Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai_service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Ruff)
        run: ruff check .

  # ----------------------------------------------------------------------------
  # 3. Docker Compose Config Validation
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Env Template
        run: cp .env.example .env

      - name: Validate Docker Compose Configuration
        run: docker compose config
