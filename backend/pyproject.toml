[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PIE", "RUF"]
ignore = [
    "B008",    # FastAPI Depends() / Security() in route signature
    "B904",    # Within an except clause, raise ... from
    "BLE001",  # Broad exception catches for network/service fallbacks
    "RUF012",  # Mutable class attributes in Pydantic/SQLAlchemy
    "E501",    # Line length
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
